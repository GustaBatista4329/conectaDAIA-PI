# Ambiente de desenvolvimento local: Postgres + backend (com hot reload) +
# frontend (Vite dev server). Não é usado em produção — lá a imagem é a do
# Dockerfile na raiz (build multi-etapa, backend serve o frontend buildado).
#
# Uso:
#   1. Copie backend/.env.example -> backend/.env e frontend/.env.example ->
#      frontend/.env (preencha as chaves necessárias).
#   2. No backend/.env, aponte DATABASE_URL para o serviço "db" deste
#      compose:
#        DATABASE_URL=postgresql+asyncpg://conectadaia:conectadaia@db:5432/conectadaia
#   3. docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: conectadaia
      POSTGRES_PASSWORD: conectadaia
      POSTGRES_DB: conectadaia
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conectadaia"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-slim
    working_dir: /frontend
    command: sh -c "npm ci && npm run dev -- --host"
    env_file:
      - frontend/.env
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
  frontend_node_modules:
